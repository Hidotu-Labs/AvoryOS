# VFIO desktop: NVIDIA owns the X screen and renders every application.
# VirtIO presents the shared desktop in the QEMU window.
Section "OutputClass"
    Identifier "NouveauPrimary"
    MatchDriver "nouveau"
    Driver "modesetting"
    Option "PrimaryGPU" "true"
EndSection

Section "ServerLayout"
    Identifier "AvoryLayout"
    Screen 0 "Screen0" 0 0
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "true"
    Option "AutoBindGPU" "true"
EndSection

Section "Device"
    Identifier "RenderGPU"
    Driver "modesetting"
    BusID "@RENDER_BUS@"
    Option "kmsdev" "@RENDER_CARD@"
    Option "AccelMethod" "glamor"
    # Presentation belongs to VirtIO; the NVIDIA head has no physical monitor.
    Option "PageFlip" "false"
    Option "SWcursor" "false"
EndSection

# Stable PCI slot supplied by the VFIO make targets. This is an output GPU,
# not an additional X screen; RandR binds it to the primary renderer.
Section "Device"
    Identifier "VirtualDisplay"
    Driver "modesetting"
    BusID "@DISPLAY_BUS@"
    Option "kmsdev" "@DISPLAY_CARD@"
    Option "AccelMethod" "none"
    Option "SWcursor" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "RenderGPU"
    GPUDevice "VirtualDisplay"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1280 800
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "CoreKeyboard" "true"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    Option "CorePointer" "true"
EndSection

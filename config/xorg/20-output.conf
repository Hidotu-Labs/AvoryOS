[General]
GreeterEnvironment=NOUVEAU_USE_ZINK=1,LIBGL_KOPPER_DRI2=true

[X11]
# Explicitly bind the output provider and activate it before the greeter.
DisplayCommand=/usr/bin/avory-prime-display

[Wayland]
SessionDir=/usr/share/wayland-sessions
SessionCommand=/usr/share/sddm/scripts/wayland-session
EnableHiDPI=true

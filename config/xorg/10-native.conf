# Ordinary desktop without VFIO: no radeonsi, so use software rendering
# (llvmpipe for GL clients via LIBGL_ALWAYS_SOFTWARE/GALLIUM_DRIVER, shadowfb
# in the modesetting driver). Forcing glamor here makes Xorg fail to open on
# a plain `make run` boot.
Section "ServerLayout"
    Identifier "AvoryLayout"
    Screen 0 "Screen0" 0 0
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "true"
    Option "AutoBindGPU" "true"
EndSection

Section "Device"
    Identifier "RenderGPU"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "none"
    Option "SWcursor" "false"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "RenderGPU"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 1280 800
    EndSubSection
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver "evdev"
    Option "Device" "/dev/input/event0"
    Option "CoreKeyboard" "true"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver "evdev"
    Option "Device" "/dev/input/event1"
    Option "CorePointer" "true"
EndSection

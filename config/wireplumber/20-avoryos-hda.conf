# Keep audio queued while a busy guest services graphics and memory faults.
# 8192 frames at 48 kHz is ~171 ms, plus the graph's processing quantum.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = {
      update-props = {
        api.alsa.headroom = 8192
      }
    }
  }
]

timeout: 3
interface_resolution: 1280x800

backdrop: 1a2b3c
term_background: 802a3b4c
term_foreground: ffffff
term_wallpaper: boot():/boot/limine/boo.png
wallpaper: boot():/boot/limine/boo.png

/AvoryOS (OpenRC)
    protocol: limine
    path: boot():/boot/kernel
    cmdline: init=/sbin/init splash quiet
    module_path: boot():/disk.img
    module_string: disk.img
    resolution: 1280x800

/Install AvoryOS (TTY Installer)
    protocol: limine
    path: boot():/boot/kernel
    cmdline: init=/sbin/init avory_installer quiet
    module_path: boot():/disk.img
    module_string: disk.img
    resolution: 1280x800

/AvoryOS Debug (Rescue Shell + Logs on Screen)
    protocol: limine
    path: boot():/boot/kernel
    cmdline: init=/bin/bash screenlog
    resolution: 1280x800